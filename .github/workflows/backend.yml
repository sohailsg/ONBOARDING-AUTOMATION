# 02 gateway + 05 executor + 07 unit gate (PR) + infra gate (main).
# Free-stack only. Root tests/ run sqlite-backed; infra-marked tests need
# Postgres (service below) and run on main/nightly, not per-PR.
name: backend

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'db/**'
      - 'tests/**'
      - 'scripts/check_secrets.py'
      - '.github/workflows/backend.yml'
  push:
    branches: [main]

jobs:
  unit:
    # PR: fast, no external services (impl 02 §5: sqlite + fakeredis + RAG stub).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install (free-only deps)
        run: pip install -r backend/requirements.txt
      - name: Gateway + executor + hardening unit tests
        run: python -m pytest tests backend/tests -q -m "not infra"

  infra:
    # main: full gate against real Postgres (impl 01 §5/§6: migrate + seed + check).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: onboarding
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install (free-only deps)
        run: pip install -r backend/requirements.txt psycopg2-binary alembic
      - name: Migrate
        run: alembic -c db/alembic.ini upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/onboarding
      - name: Drift check (models vs DB must match)
        run: alembic -c db/alembic.ini check
        env:
          DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/onboarding
      - name: Seed (idempotent) + full suite incl. infra
        run: |
          python db/seeds/seed_demo.py
          python -m pytest tests backend/tests -q
        env:
          DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/onboarding
