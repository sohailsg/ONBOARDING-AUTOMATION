name: frontend

on:
  push:
    paths:
      - "frontend/**"
      - "backend/openapi.yaml"
      - "backend/tools/gen_types.py"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/openapi.yaml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps for codegen
        run: pip install pyyaml

      - name: Install frontend deps
        run: npm ci

      - name: OpenAPI codegen drift check (06 §6 — type drift fails build)
        run: |
          npm run gen-api
          git diff --exit-code -- lib/api.types.ts || (
            echo "::error::lib/api.types.ts is stale — run 'npm run gen-api' and commit."
            exit 1
          )

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: E2E (MSW mocks, system Chrome)
        run: |
          npx playwright install --with-deps chromium || true
          npm run test:e2e
